<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 236" width="420" height="236" role="img"
     aria-label="Placeholder for a GIF">
  <rect x="0" y="0" width="420" height="236" rx="12" fill="#0d1117"/>
  <rect x="10" y="10" width="400" height="216" rx="10" fill="none" stroke="#64748b"
        stroke-width="2.5" stroke-dasharray="11 9" opacity="0.65">
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(210 96)">
    <circle r="26" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.9">
      <animate attributeName="r" values="18;30;18" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="7" fill="#f0a020">
      <animate attributeName="cy" values="0;-9;0" dur="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="210" y="168" text-anchor="middle" fill="#8b98a9"
        font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15"
        letter-spacing="2">your GIF goes here</text>
  <text x="210" y="194" text-anchor="middle" fill="#6b7a8d"
        font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5"
        letter-spacing="1">drop it in assets/ and update the src</text>
</svg>
